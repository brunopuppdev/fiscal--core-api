services:
  postgres:
    image: postgres:16-alpine
    container_name: emissornf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-emissornf}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - emissornf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  emissornf-postgres-data:
